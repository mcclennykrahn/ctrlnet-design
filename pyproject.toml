[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlnet"
version = "0.1.0"
readme = "README.md"
description = "平面控制网精度估算与优化设计 MVP 计算核心"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "geographiclib>=2.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "httpx>=0.27",
    "fastapi>=0.110",
    "pillow>=10",
    "rasterio>=1.3",
    "scipy>=1.11",
]
build = ["build>=1.2", "wheel", "setuptools>=61"]
demo = ["ipykernel>=6", "nbconvert>=7", "nbformat>=5"]
terrain = ["rasterio>=1.3"]
tiles = ["pillow>=10", "rasterio>=1.3"]
opt = ["scipy>=1.11"]
webmap = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10",
    "rasterio>=1.3",
]
e2e = [
    "playwright>=1.50",
]

[project.scripts]
ctrlnet = "ctrlnet.cli:main"
ctrlnet-web = "ctrlnet.webmap.__main__:main"
ctrlnet-package = "ctrlnet.package:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ctrlnet*"]

[tool.setuptools.package-data]
"ctrlnet.webmap" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/leaflet/*.js",
    "static/leaflet/*.css",
    "static/leaflet/LICENSE",
    "static/leaflet/images/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
