[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlnet"
version = "0.1.0"
description = "平面控制网精度估算与优化设计 MVP 计算核心"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ctrlnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# 允许在未安装 editable 包时直接从 src 布局运行测试（CI 与本地均适用）。
pythonpath = ["src"]
